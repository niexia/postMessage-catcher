<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>popup</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #e8eaed;
        background:
          radial-gradient(900px 520px at 18% -8%, #1d2637 0%, rgba(29, 38, 55, 0) 60%),
          radial-gradient(900px 600px at 100% 0%, #172033 0%, rgba(23, 32, 51, 0) 55%), #0b0d11;
      }
      .frame {
        height: 100%;
        padding: 52px 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7d8aa1;
        font-weight: 600;
      }
      h1 {
        margin-top: 8px;
        font-size: 34px;
        line-height: 1.12;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 8px;
        font-size: 15px;
        color: #98a2b3;
      }
      .shots {
        margin-top: 32px;
        display: flex;
        gap: 32px;
      }
      figure {
        flex: 1;
        min-width: 0;
      }
      figcaption {
        margin-bottom: 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7d8aa1;
        font-weight: 600;
      }
      img {
        width: 100%;
        height: 406px;
        object-fit: cover;
        object-position: top;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .chips {
        margin-top: 28px;
        display: flex;
        gap: 10px;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        color: #b8c0cc;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="eyebrow">Popup</div>
      <h1>Record. Inspect. Switch themes.</h1>
      <p>
        Per-tab recording, a master switch, and a System / Light / Dark theme that is remembered.
      </p>
      <div class="shots">
        <figure>
          <figcaption>Dark</figcaption>
          <img src="/docs/screenshots/popup-dark.png" alt="" />
        </figure>
        <figure>
          <figcaption>Light</figcaption>
          <img src="/docs/screenshots/popup-light.png" alt="" />
        </figure>
      </div>
      <div class="chips">
        <span class="chip">Per-tab capture</span>
        <span class="chip">Local only</span>
        <span class="chip">No network</span>
      </div>
    </div>
  </body>
</html>
