<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>promo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #e8eaed;
        background:
          radial-gradient(420px 260px at 15% -10%, #1d2637 0%, rgba(29, 38, 55, 0) 65%), #0b0d11;
      }
      .frame {
        height: 100%;
        padding: 26px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      .brand span {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7d8aa1;
        font-weight: 600;
      }
      h1 {
        margin-top: 16px;
        font-size: 24px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 8px;
        font-size: 12px;
        color: #98a2b3;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="brand">
        <img src="/public/icon/128.png" alt="" />
        <span>postMessage-catcher</span>
      </div>
      <h1>See every message,<br />in every frame.</h1>
      <p>DevTools panel · all frames · local only</p>
    </div>
  </body>
</html>
